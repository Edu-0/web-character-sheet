name: Executáveis Windows
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:unit
      - run: npm run build:desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run test:desktop
      - shell: pwsh
        run: |
          $env:FICHA_PORTABLE_EXECUTABLE = (Get-ChildItem output/desktop/*/*-portable-x64.exe).FullName
          npm run test:portable
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Ficha-RPG-Windows-x64
          compression-level: 0
          if-no-files-found: error
          path: |
            output/desktop/*/*.exe
            output/desktop/*/SHA256SUMS.txt
            output/desktop/*/LEIA-ME.txt
            output/desktop/*/desktop-build.json
